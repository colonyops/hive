version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - containedctx
    - contextcheck
    - depguard
    - dogsled
    - errcheck
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gochecknoinits
    - gocritic
    - goprintffuncname
    - govet
    - ineffassign
    - interfacebloat
    - misspell
    - modernize
    - nakedret
    - noctx
    - revive
    - sqlclosecheck
    - staticcheck
    - tagalign
    - testifylint
    - unconvert
    - unused
    - usetesting
    - whitespace
    - zerologlint
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/util
              desc: |
                Deprecated: As of Go 1.16, the same functionality is now provided by
                package io or package os, and those implementations should be
                preferred in new code. See the specific function documentation for
                details.
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package
            - pkg: github.com/rs/zerolog/log
              desc: Take a zerolog.Logger as a parameter and label it with logutils.Component. No program assigns the global logger, so it writes to stderr.
        # depguard matches these globs against absolute paths. A checkout
        # below a directory named "cmd" exempts every file from this rule.
        shared-surface-free:
          files:
            - "**/internal/**"
            - "!**/cmd/**"
          deny:
            - pkg: charm.land
              desc: Shared internal/ must not render. Put UI code below cmd/<artifact>/internal.
            - pkg: github.com/charmbracelet
              desc: Shared internal/ must not render. Put UI code below cmd/<artifact>/internal.
            - pkg: github.com/wailsapp
              desc: Shared internal/ must not depend on the desktop runtime.
        domain-is-pure:
          files:
            - "**/internal/domain/**"
            - "!**/cmd/**"
          # Longer lax-mode allow matches override the internal deny.
          list-mode: lax
          allow:
            - github.com/colonyops/hive/internal/domain
          deny:
            - pkg: github.com/colonyops/hive/internal
              desc: domain imports only domain (docs/architecture.md, "Layers and the dependency rule").
            - pkg: os/exec
              desc: domain does no I/O; put drivers in internal/platform.
            - pkg: net
              desc: domain does no I/O; put drivers in internal/platform.
            - pkg: database/sql
              desc: domain does no I/O; persistence belongs in the store layer.
            - pkg: github.com/fsnotify
              desc: domain does no I/O; put watchers in internal/platform.
        platform-is-a-driver:
          files:
            - "**/internal/platform/**"
            - "!**/cmd/**"
          # Longer lax-mode allow matches override the internal deny.
          list-mode: lax
          allow:
            - github.com/colonyops/hive/internal/domain
            - github.com/colonyops/hive/internal/platform
          deny:
            - pkg: github.com/colonyops/hive/internal
              desc: platform drives one outside system and imports only domain and other drivers (docs/architecture.md, "Layers and the dependency rule"). Take what you need as a parameter.
        config-is-data:
          files:
            - "**/internal/config/**"
            - "!**/cmd/**"
          list-mode: lax
          allow:
            - github.com/colonyops/hive/internal/domain
            - github.com/colonyops/hive/internal/config
          deny:
            - pkg: github.com/colonyops/hive/internal
              desc: config is data. It loads, validates and writes config.yaml and imports only domain (docs/architecture.md, "Layers and the dependency rule").
        store-is-persistence:
          files:
            - "**/internal/store/**"
            - "!**/cmd/**"
          list-mode: lax
          allow:
            - github.com/colonyops/hive/internal/domain
            - github.com/colonyops/hive/internal/store
            - github.com/colonyops/hive/internal/platform/sqlite
          deny:
            - pkg: github.com/colonyops/hive/internal
              desc: store is hive.db persistence and imports only domain and platform/sqlite (docs/architecture.md, "Layers and the dependency rule").
        core:
          files:
            - "**/cmd/desktop/internal/app/**"
          deny:
            - pkg: github.com/wailsapp/wails/v3
              desc: |
                cmd/desktop/internal/app is the headless core: no transport, no
                Wails. A Wails service struct belongs in
                cmd/desktop/internal/adapter/wailsui; a core package that needs
                something from the outside declares an interface and takes it
                as a constructor parameter. See docs/architecture.md, "Layers
                and the dependency rule".
            - pkg: github.com/colonyops/hive/cmd/desktop/internal/adapter
              desc: |
                Dependencies point one way: adapter -> app -> shared internal.
                A core package that needs something from an adapter has the
                interface backwards — declare it in app and let the adapter
                satisfy it structurally.
        # The OpenTelemetry API/SDK split (docs/architecture.md, "Telemetry").
        # Any package may import the API and declare its own instruments
        # against the global provider, which is the no-op provider until
        # cmd/desktop/internal/app/telemetry registers a real one. The SDK
        # stays in one place. Test files are exempt because asserting on
        # telemetry is what the SDK's in-memory readers are for.
        otelsdk:
          files:
            - "$all"
            - "!$test"
            - "!**/cmd/desktop/internal/app/telemetry/**"
          deny:
            - pkg: go.opentelemetry.io/otel/sdk
              desc: |
                The OTel SDK is cmd/desktop/internal/app/telemetry's. A package
                that emits declares package-level instruments through
                internal/platform/observe and needs no SDK type to do it. See
                docs/architecture.md, "Telemetry".
            - pkg: go.opentelemetry.io/otel/exporters
              desc: |
                An exporter is wired once, in cmd/desktop/internal/app/telemetry.
                See docs/architecture.md, "Telemetry".
        cli-no-desktop-deps:
          files:
            - "**/cmd/hive/**"
          deny:
            - pkg: github.com/wailsapp
              desc: The CLI must not depend on the desktop runtime.
            - pkg: github.com/dop251/goja
              desc: The CLI must not depend on the desktop flow runtime.
            - pkg: go.opentelemetry.io/otel/sdk
              desc: The CLI must not depend on the desktop telemetry runtime.
            - pkg: github.com/colonyops/hive/cmd/desktop
              desc: The CLI must not import the desktop program.
    exhaustive:
      default-signifies-exhaustive: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^application\.Get$
          msg: >-
            Rule 2: application.Get() is only valid inside
            cmd/desktop/internal/adapter/wailsui. Take what you need as a
            constructor parameter instead.
        - pattern: ^context\.Background$
          msg: >-
            Rule 3: context.Context is the first parameter of every core
            method. context.Background() inside a service method makes CLI
            cancellation and HTTP deadlines impossible.
        - pattern: ^emit[A-Z]\w*$
          msg: >-
            Rule 5: the core publishes a typed payload to app/events. Wake-up
            degradation belongs to the wailsui adapter subscriber.
    gocritic:
      enabled-checks:
        - ruleguard
    interfacebloat:
      # Consumer-defined interfaces here are narrow, but
      # dispatch.OutputCommandStore has seven that are the complete lifecycle
      # of one entity, and the worker calls all seven.
      max: 8
    revive:
      confidence: 3
      severity: warning
    tagalign:
      order:
        - json
        - schema
        - yaml
        - yml
        - toml
        - validate
    testifylint:
      enable-all: true
  exclusions:
    generated: lax
    rules:
      # The linters Hive Desktop adopted beyond the shared set apply to the
      # desktop program only. The CLI and the shared packages keep the set
      # they were written against.
      - path-except: (^|/)cmd/desktop/
        linters: [containedctx, contextcheck, forbidigo, forcetypeassert, interfacebloat, modernize, noctx, sqlclosecheck, usetesting]
      # forbidigo has no per-rule path filter, so the scope of its rules is
      # carved here. The adapter and package main are where application.Get,
      # context.Background and the emit helpers belong. Directory rules match
      # "(^|/)dir/", never "^dir/": golangci-lint reports a file relative to a
      # base derived from the shared build cache, so an anchored exclusion can
      # silently stop matching in a second checkout.
      - path: (^|/)cmd/desktop/internal/adapter/wailsui/
        linters: [forbidigo]
      - path: (^|/)cmd/desktop/[^/]+\.go$
        linters: [forbidigo]
      # app.App holds the application's lifetime context. The config watchers
      # and the auth change hook are wired at construction and run on their
      # own goroutines, so there is no caller context to thread.
      - path: (^|/)cmd/desktop/internal/app/app\.go
        linters: [containedctx]
      # Desktop dev tooling: a main() is a legitimate context
      # root, and a subprocess in a dev tool needs no cancellation.
      - path: (^|/)cmd/desktop/(devserver|devtools)/
        linters: [forbidigo, noctx, contextcheck]
      # httptest.NewRequest and http.Post in tests.
      - path: _test\.go
        linters: [noctx]
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  fix: false
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    gofumpt:
      extra-rules: false

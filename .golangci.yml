version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - depguard
    - dogsled
    - errcheck
    - errorlint
    - exhaustive
    - gochecknoinits
    - gocritic
    - goprintffuncname
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - tagalign
    - testifylint
    - unconvert
    - unused
    - whitespace
    - zerologlint
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/util
              desc: |
                Deprecated: As of Go 1.16, the same functionality is now provided by
                package io or package os, and those implementations should be
                preferred in new code. See the specific function documentation for
                details.
            - pkg: github.com/pkg/errors
              desc: Should be replaced by standard lib errors package
        # depguard matches these globs against absolute paths. A checkout
        # below a directory named "cmd" exempts every file from this rule.
        shared-surface-free:
          files:
            - "**/internal/**"
            - "!**/cmd/**"
          deny:
            - pkg: charm.land
              desc: Shared internal/ must not render. Put UI code below cmd/<artifact>/internal.
            - pkg: github.com/charmbracelet
              desc: Shared internal/ must not render. Put UI code below cmd/<artifact>/internal.
            - pkg: github.com/wailsapp
              desc: Shared internal/ must not depend on the desktop runtime.
        cli-no-desktop-deps:
          files:
            - "**/cmd/hive/**"
          deny:
            - pkg: github.com/wailsapp
              desc: The CLI must not depend on the desktop runtime.
            - pkg: github.com/dop251/goja
              desc: The CLI must not depend on the desktop flow runtime.
            - pkg: go.opentelemetry.io/otel/sdk
              desc: The CLI must not depend on the desktop telemetry runtime.
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-checks:
        - ruleguard
    revive:
      confidence: 3
      severity: warning
    tagalign:
      order:
        - json
        - schema
        - yaml
        - yml
        - toml
        - validate
    testifylint:
      enable-all: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  fix: false
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
  settings:
    gofumpt:
      extra-rules: false

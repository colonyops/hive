services:
  remote:
    build:
      context: ../..
      dockerfile: test/remote/Dockerfile
    ports:
      - "127.0.0.1:${HIVE_REMOTE_SSH_PORT:-19222}:22"
    volumes:
      - ${HIVE_REMOTE_STATE:?}/id_ed25519.pub:/run/client.pub:ro
    healthcheck:
      test: ["CMD", "pgrep", "-x", "sshd"]
      interval: 1s
      timeout: 2s
      retries: 30

x-server: &server
  build:
    context: ../..
    dockerfile: test/remote/Dockerfile
  image: hive-remote-fixture:local
  volumes:
    - ${HIVE_REMOTE_STATE:?}/id_ed25519.pub:/run/client.pub:ro
  stop_grace_period: 2s
  healthcheck:
    test: ["CMD", "pgrep", "-x", "sshd"]
    interval: 1s
    timeout: 2s
    retries: 30

services:
  server-a:
    <<: *server
    ports:
      - "127.0.0.1:${HIVE_REMOTE_SSH_PORT_A:-19222}:22"
  server-b:
    <<: *server
    ports:
      - "127.0.0.1:${HIVE_REMOTE_SSH_PORT_B:-19223}:22"

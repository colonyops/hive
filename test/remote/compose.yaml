x-server: &server
  build:
    context: ../..
    dockerfile: test/remote/Dockerfile
  # One tag per project, so another fixture's build cannot replace the binary
  # a restarted server runs.
  image: hive-remote-fixture:${HIVE_REMOTE_PROJECT:?}
  stop_grace_period: 2s
  healthcheck:
    # A running sshd process is not yet one that accepts connections.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/22"]
    interval: 1s
    timeout: 2s
    retries: 30

services:
  server-a:
    <<: *server
    ports:
      - "127.0.0.1:${HIVE_REMOTE_SSH_PORT_A:-19222}:22"
    volumes:
      - ${HIVE_REMOTE_STATE:?}/id_ed25519.pub:/run/client.pub:ro
      - ${HIVE_REMOTE_STATE:?}/server-a_host_ed25519_key:/run/host_key:ro
  server-b:
    <<: *server
    ports:
      - "127.0.0.1:${HIVE_REMOTE_SSH_PORT_B:-19223}:22"
    volumes:
      - ${HIVE_REMOTE_STATE:?}/id_ed25519.pub:/run/client.pub:ro
      - ${HIVE_REMOTE_STATE:?}/server-b_host_ed25519_key:/run/host_key:ro

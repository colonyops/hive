version: "0.2.4"
git_path: git
experimental:
  daemon: true
agents:
  default: testbash
  testbash:
    command: bash
  # An agent whose command is not installed, for hive servers probe.
  missing:
    command: no-such-agent
rules:
  - spawn:
      # claude is the fake agent from the fixture image (fake-claude).
      - "tmux new-session -d -s {{ .Name | shq }} -c {{ .Path | shq }} claude"
  # A copy rule makes the server read the create request's source directory,
  # which must be a directory on the server, not on the client.
  - copy:
      - .env

# Every task runs from the repo root, where the module lives.

["drive-server:dev"]
description = "Run the drive server on ./.data/drive-server with mail printed to stdout"
env = { HIVE_DRIVE_SERVER_DATA_DIR = "./.data/drive-server", HIVE_DRIVE_SERVER_CONFIG_DIR = "./cmd/drive-server/dev", HIVE_DRIVE_SERVER_BASE_URL = "http://127.0.0.1:8080", HIVE_DRIVE_SERVER_LOG_LEVEL = "debug" }
run = "go run ./cmd/drive-server serve --dev-log-mail"

["drive-server:test"]
description = "Run the drive server's Go tests"
run = "go test ./cmd/drive-server/..."

["drive-server:build"]
description = "Build the hive-drive-server binary (web UI embedded) into cmd/drive-server/bin/"
depends = ["drive-server:frontend:build"]
run = "go build -o cmd/drive-server/bin/hive-drive-server ./cmd/drive-server"

["drive-server:check:migrations"]
description = "Verify the drive server's SQLite migrations are ordered and released history is immutable"
run = [
  "./scripts/check-migration-order.sh cmd/drive-server/internal/store/control/migrations",
  "./scripts/check-migration-order.sh cmd/drive-server/internal/store/userdb/migrations",
]

# The npm workspace root is the repo root, so one install serves the desktop
# frontend, @hive/ui, and this frontend.
["drive-server:frontend:install"]
description = "Install the npm workspace dependencies when they are missing"
dir = "{{config_root}}"
run = "test -d node_modules || npm ci"

["drive-server:frontend:build"]
description = "Typecheck and build the drive server web UI into cmd/drive-server/frontend/dist"
depends = ["drive-server:frontend:install"]
dir = "{{config_root}}"
run = "npm run build -w drive-server-frontend"

["drive-server:frontend:lint"]
description = "Lint the drive server web UI (ESLint, type-aware)"
dir = "{{config_root}}"
run = "npm run lint -w drive-server-frontend"

["drive-server:frontend:test"]
description = "Run the drive server web UI unit tests (vitest)"
dir = "{{config_root}}"
run = "npm run test -w drive-server-frontend"

["drive-server:frontend:format:check"]
description = "Check the drive server web UI formatting (Prettier)"
dir = "{{config_root}}"
run = "npm run format:check -w drive-server-frontend"

["drive-server:image"]
description = "Build the hive-drive-server container image locally as hive-drive-server:dev, with the web UI embedded"
depends = ["drive-server:build"]
run = """
set -euo pipefail
ctx=$(mktemp -d)
trap 'rm -rf "$ctx"' EXIT
# The Dockerfile copies from <os>/<arch>/hive-drive-server, the layout
# goreleaser's dockers_v2 hands it, so the local build lays the binary out the
# same way.
arch=$(go env GOARCH)
mkdir -p "$ctx/linux/$arch"
GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -o "$ctx/linux/$arch/hive-drive-server" ./cmd/drive-server
cp cmd/drive-server/Dockerfile "$ctx/Dockerfile"
docker build --platform "linux/$arch" -t hive-drive-server:dev "$ctx"
"""

# Hive Relay. Included by the root mise.toml, so these run from anywhere in the
# repo as `mise run relay:<task>`. Every task runs from the repo root, where the
# module lives.

["relay:dev"]
description = "Run the relay on ./.data/relay with a minted dev key on stdout and email sign-in codes printed there too (args pass through)"
env = { RELAY_LOG_LEVEL = "debug", RELAY_SMTP_URL = "log", RELAY_ALLOWED_EMAILS = "dev@example.com" }
run = "go run ./cmd/relay serve --data-dir ./.data/relay --public-url http://127.0.0.1:8080 --mint dev@example.com"

["relay:check:migrations"]
description = "Verify the relay's SQLite migrations are ordered and released history is immutable"
run = "./cmd/desktop/scripts/check-migration-order.sh cmd/relay/internal/store/sqlite/migrations"

["relay:test"]
description = "Run the relay's Go tests"
run = "go test ./cmd/relay/..."

["relay:build"]
description = "Build the hive-relay binary into cmd/relay/bin/"
run = "go build -o cmd/relay/bin/hive-relay ./cmd/relay"

["relay:image"]
description = "Build the hive-relay container image locally as hive-relay:dev from a relay:build output"
depends = ["relay:build"]
run = """
set -euo pipefail
ctx=$(mktemp -d)
trap 'rm -rf "$ctx"' EXIT
# The Dockerfile copies from <os>/<arch>/hive-relay, the layout goreleaser's
# dockers_v2 hands it, so the local build lays the binary out the same way.
arch=$(go env GOARCH)
mkdir -p "$ctx/linux/$arch"
GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -o "$ctx/linux/$arch/hive-relay" ./cmd/relay
cp cmd/relay/Dockerfile "$ctx/Dockerfile"
docker build --platform "linux/$arch" -t hive-relay:dev "$ctx"
"""

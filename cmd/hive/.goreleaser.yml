# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
#
# Run goreleaser from the repository root:
#   goreleaser release --config cmd/hive/.goreleaser.yml
version: 2
project_name: hive
before:
  hooks:
    - go mod tidy

builds:
  - id: hive
    main: ./cmd/hive
    binary: hive
    # The build variables are in the cli package, not in main, because the
    # wrapper at the module root runs the same package.
    ldflags:
      - -s -w
      - -X github.com/colonyops/hive/cmd/hive/cli.version={{ .Version }}
      - -X github.com/colonyops/hive/cmd/hive/cli.commit={{ .Commit }}
      - -X github.com/colonyops/hive/cmd/hive/cli.date={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm
      - arm64
    goarm:
      - "7"

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# The release body is every program's promoted release notes, which the
# publish workflow passes with --release-notes. A commit log of this
# repository would also list every desktop commit.
changelog:
  disable: true

homebrew_casks:
  - repository:
      owner: colonyops
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/colonyops/hive"
    description: "CLI/TUI for managing multiple AI agent sessions in isolated git environments"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/hive"]
          end
    caveats: "This binary is not signed or notarized. The installer removes the macOS quarantine attribute automatically.\n\nRequires tmux and git to be installed."






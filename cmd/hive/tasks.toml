# The hive CLI/TUI. Included by the root mise.toml, so these run from anywhere
# in the repo as `mise run cli:<task>`. Every task runs from the repo root,
# where the module, the root main.go, and the Dockerfiles' build context live.

# ── Run ──────────────────────────────────────────────────────────────────────

["cli:dev"]
description = "Run the hive TUI against the dev config and ./.data (args pass through: mise run cli:dev -- new)"
depends = ["generate"]
env = { HIVE_LOG_LEVEL = "debug", HIVE_LOG_FILE = "./dev.log", HIVE_CONFIG = "./cmd/hive/dev/config.dev.yaml", HIVE_DATA_DIR = "./.data" }
# raw: the TUI needs the terminal itself; prefixed output leaves it without a TTY.
raw = true
run = "go run ./cmd/hive"

["cli:start"]
description = "Run the hive TUI against your own global config and sessions (args pass through)"
depends = ["generate"]
# raw: the TUI needs the terminal itself; prefixed output leaves it without a TTY.
raw = true
run = "go run ./cmd/hive"

["cli:validate"]
description = "Run hive doctor against the dev config"
env = { HIVE_CONFIG = "./cmd/hive/dev/config.dev.yaml" }
run = "go run ./cmd/hive doctor"

["cli:validate:invalid"]
description = "Run hive doctor against an intentionally invalid config"
env = { HIVE_CONFIG = "./cmd/hive/dev/config.invalid.yaml" }
run = "go run ./cmd/hive doctor || true"

# ── Build ────────────────────────────────────────────────────────────────────

["cli:build"]
description = "Build the hive CLI with goreleaser"
depends = ["generate"]
run = "goreleaser build --snapshot --clean --config cmd/hive/.goreleaser.yml"

["cli:build:container"]
description = "Build only the linux binary for the host arch (used by the container images)"
hide = true
depends = ["generate"]
run = "GOOS=linux goreleaser build --snapshot --clean --single-target --config cmd/hive/.goreleaser.yml"

# ── Isolated environments ────────────────────────────────────────────────────

# The only safe place for anything that drives real tmux sessions: integration
# tests and pane-mutating `hive x assess` commands have crashed host tmux.
["cli:container"]
description = "Build this branch into a Docker image and open an ephemeral container with hive and tmux"
depends = ["cli:build:container"]
run = "docker run --rm -it -e HIVE_ASSESS_ISOLATED=1 -e CLAUDE_CREDENTIALS=\"$CLAUDE_CREDENTIALS\" $(docker build -q -f cmd/hive/Dockerfile .)"

["cli:container:rootless"]
description = "cli:container with rootless podman"
depends = ["cli:build:container"]
run = "podman run --rm -it -e HIVE_ASSESS_ISOLATED=1 -e CLAUDE_CREDENTIALS=\"$CLAUDE_CREDENTIALS\" $(podman build -q -f cmd/hive/Dockerfile .)"

["cli:integration"]
description = "Run the CLI integration tests inside Docker (never on the host)"
depends = ["cli:build:container"]
run = "docker build -f cmd/hive/Dockerfile.test -t hive-integration-test . && docker run --rm hive-integration-test"

# The ssh fixture for remote hive servers: two containers, server-a and
# server-b, and the Go tests in test/remote that drive them.
["cli:remote:up"]
description = "Start the two-server ssh fixture that runs hive in Docker and write its ssh_config"
depends = ["cli:build:container"]
run = "test/remote/run.sh up"

["cli:remote:test"]
description = "Run the remote tests against a fresh ssh fixture, then remove it (args go to go test)"
depends = ["cli:build:container"]
run = "test/remote/run.sh test"

["cli:remote:run"]
description = "Run the remote tests against the fixture cli:remote:up started (args go to go test)"
run = "test/remote/run.sh run"

["cli:remote:down"]
description = "Remove the ssh fixture"
run = "test/remote/run.sh down"

# A client and two servers in Docker for agents to drive by hand. The
# cli-smoke skill says how.
["cli:smoke:up"]
description = "Start a throwaway client and two servers in Docker, or replace them with this branch's binary"
depends = ["cli:build:container"]
run = "test/smoke/run.sh up"

["cli:smoke:exec"]
description = "Run a command in the smoke stack as the hive user: mise run cli:smoke:exec -- client hive session list"
run = "test/smoke/run.sh exec"

["cli:smoke:root"]
description = "Run a command in the smoke stack as root: mise run cli:smoke:root -- server-a ps aux"
run = "test/smoke/run.sh root"

["cli:smoke:tui"]
description = "Drive the TUI on the smoke stack client: start, keys, show, stop"
run = "test/smoke/run.sh tui"

["cli:smoke:fault"]
description = "Break a smoke stack server: mise run cli:smoke:fault -- stuck-daemon server-a"
run = "test/smoke/run.sh fault"

["cli:smoke:down"]
description = "Remove the smoke stack and everything in it"
run = "test/smoke/run.sh down"

["cli:smoke:test"]
description = "Check the smoke stack tooling against a fresh stack, then remove it"
depends = ["cli:build:container"]
run = "test/smoke/run.sh test"

# ── Gates ────────────────────────────────────────────────────────────────────

["cli:check:goreleaser"]
description = "Validate the CLI's goreleaser config"
run = "goreleaser check --config cmd/hive/.goreleaser.yml"

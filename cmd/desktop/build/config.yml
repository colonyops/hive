# This file contains the configuration for this project.
# When you update `info`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets. macOS uses
# the committed build/darwin/icons.icns generated by build/icons/generate.sh.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "ColonyOps"
  productName: "Hive"
  productIdentifier: "com.hivedesktop.app"
  description: "Hive desktop application"
  copyright: "(c) 2026 ColonyOps"
  comments: ""
  version: "0.1.0"

# root_path is the repo root, so the watcher sees the shared internal/** the
# app runs on as well as cmd/desktop/**. It resolves against the directory
# `wails3 dev` runs in (cmd/desktop), and each execute's dir resolves against
# root_path.
dev_mode:
  root_path: ../..
  log_level: warn
  debounce: 1000
  ignore:
    # An entry is matched against the absolute path of a changed file: a plain
    # name matches any one path component, and a pattern matches the whole
    # path. A generic name is a pattern here, so "bin" does not hide
    # internal/platform/tmux/bin.
    #
    # No entry names a directory that can hold a nested checkout
    # (.claude/worktrees, .data): it would also match every file of a dev run
    # inside that checkout, which would then never rebuild. The cost is that
    # an edit in a nested checkout rebuilds this app too.
    dir:
      - .git
      - node_modules
      - frontend
      - "*/cmd/desktop/bin/*"
      - "*/cmd/hive/*"
      - "*/cmd/tools/*"
      - "*/docs/docs/*"
      - "*/docs/site/*"
      - "*/docs/.venv/*"
      - "*/docs/.cache/*"
      # Agent workspaces of the dev instance. An agent that writes a script
      # there must not restart the app it runs in.
      - "*/.hive-desktop/config/*"
      - "*/.hive-desktop-onboarding/config/*"
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      dir: cmd/desktop
      type: blocking
    - cmd: wails3 task common:dev:frontend
      dir: cmd/desktop
      type: background
    - cmd: wails3 task run
      dir: cmd/desktop
      type: primary

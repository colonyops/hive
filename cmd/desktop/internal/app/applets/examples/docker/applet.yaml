version: 1
title: Docker
icon: container
view: table
cwd: "~"
data:
  command: docker ps --all --format '{{json .}}'
  refresh: 5s
columns:
  - key: Names
    label: Name
  - key: Image
  - key: State
    tones:
      running: success
      restarting: accent
      paused: accent
      exited: muted
      dead: danger
  - key: Status
actions:
  - id: logs
    label: Logs
    key: l
    mode: terminal
    run: docker logs --follow --tail 200 "$HIVE_ROW_ID"
  - id: restart
    label: Restart
    key: r
    run: docker restart "$HIVE_ROW_ID"
  - id: stop
    label: Stop
    key: s
    confirm: Stop this container?
    run: docker stop "$HIVE_ROW_ID"
  - id: start
    label: Start
    key: u
    run: docker start "$HIVE_ROW_ID"

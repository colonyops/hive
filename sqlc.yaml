version: "2"
sql:
  - engine: "sqlite"
    queries:
      - "internal/store/db/queries/queries.sql"
      - "internal/store/db/queries/queries_hc.sql"
      - "internal/store/db/queries/queries_drive.sql"
    schema: "internal/store/db/migrations/*.up.sql"
    gen:
      go:
        package: "db"
        out: "internal/store/db"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        overrides:
          - column: "hc_items.status"
            go_type:
              import: "github.com/colonyops/hive/internal/domain/hc"
              type: "Status"
          - column: "hc_items.type"
            go_type:
              import: "github.com/colonyops/hive/internal/domain/hc"
              type: "ItemType"
  - engine: "sqlite"
    queries:
      - "cmd/desktop/internal/app/data/queries/queries"
    schema: "cmd/desktop/internal/app/data/queries/migrations/*.up.sql"
    gen:
      go:
        package: "queries"
        out: "cmd/desktop/internal/app/data/queries"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
  - engine: "sqlite"
    queries:
      - "cmd/drive-server/internal/store/control/queries"
    schema: "cmd/drive-server/internal/store/control/migrations"
    gen:
      go:
        package: "db"
        out: "cmd/drive-server/internal/store/control/db"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_result_struct_pointers: false
        overrides:
          - column: "api_tokens.scope"
            go_type:
              import: "github.com/colonyops/hive/cmd/drive-server/internal/core"
              type: "Scope"
  - engine: "sqlite"
    queries:
      - "cmd/drive-server/internal/store/userdb/queries"
    schema: "cmd/drive-server/internal/store/userdb/migrations"
    gen:
      go:
        package: "db"
        out: "cmd/drive-server/internal/store/userdb/db"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_result_struct_pointers: false
        overrides:
          - column: "documents.kind"
            go_type:
              import: "github.com/colonyops/hive/internal/domain/drive"
              type: "Kind"

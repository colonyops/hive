[task_config]
# The site's tasks (docs:*) live beside the site.
includes = ["docs/tasks.toml"]

[tools]
# Go Tools
"go" = "1.27.1"
"go:golang.org/x/tools/cmd/deadcode" = "0.49.0"
"go:github.com/abice/go-enum" = "v0.9.4"
"github:hay-kot/gobusgen" = "v0.3.0"
"github:sqlc-dev/sqlc" = "v1.31.1"
golangci-lint = "2.13.2"
"goreleaser" = "2.17.1"

# Site Tools (docs/). Zensical itself is pinned in docs/pyproject.toml.
python = "3.13.13"
uv = "0.12.13"

# GitHub Tools
actionlint = "1.7.12"

[env]
HIVE_LOG_LEVEL = "debug"
HIVE_LOG_FILE = "./dev.log"

[tasks."generate:enums"]
description = "Generate enum methods using go-enum"
sources = ["internal/core/action/type.go", "internal/core/hc/item.go", "internal/core/notify/store.go", "internal/core/todo/todo.go", "internal/sources/backend.go"]
outputs = ["internal/core/action/type_enum.go", "internal/core/hc/item_enum.go", "internal/core/notify/store_enum.go", "internal/core/todo/todo_enum.go", "internal/sources/backend_enum.go"]
run = "go-enum --nocase --names --marshal -f internal/core/action/type.go -f internal/core/hc/item.go -f internal/core/notify/store.go -f internal/core/todo/todo.go -f internal/sources/backend.go"

[tasks.generate]
description = "Run all code generators"
depends = ["generate:enums"]
sources = [
  "internal/core/eventbus/events.go",
  "internal/data/db/queries/queries.sql",
  "internal/data/db/queries/queries_hc.sql",
  "internal/data/db/migrations/*.up.sql",
  "sqlc.yaml",
]
outputs = [
  "internal/core/eventbus/eventbus.gen.go",
  "internal/data/db/db.go",
  "internal/data/db/models.go",
  "internal/data/db/queries.sql.go",
  "internal/data/db/queries_hc.sql.go",
]
run = ["go generate ./...", "sqlc generate"]

[tasks.start]
alias = "default"
description = "Run hive with global config (supports CLI args)"
depends = ["generate"]
run = "go run ./cmd/hive"

[tasks.dev]
description = "Run hive with dev config (supports CLI args)"
depends = ["generate"]
env = { HIVE_LOG_LEVEL = "debug", HIVE_LOG_FILE = "./dev.log", HIVE_CONFIG = "./cmd/hive/dev/config.dev.yaml", HIVE_DATA_DIR = "./.data" }
run = "go run ./cmd/hive"

[tasks.build]
description = "Build with goreleaser"
depends = ["generate"]
run = "goreleaser build --snapshot --clean --config cmd/hive/.goreleaser.yml"

[tasks.test]
description = "Run all go tests"
run = "go test ./..."

[tasks."test:race"]
description = "Run all go tests with the race detector; CI runs this on main"
run = "go test -race ./..."

[tasks.coverage]
description = "Run tests with race detection and coverage"
quiet = true
run = "go test -race -coverprofile=coverage.out -covermode=atomic ./... -v -cover"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Run golangci-lint fmt"
run = "golangci-lint fmt ./..."

[tasks.tidy]
description = "Tidy go.mod and go.sum; the counterpart of check:tidy that changes files"
run = "go mod tidy"

[tasks."check:tidy"]
description = "Fail when go.mod or go.sum need tidying"
run = "go mod tidy -diff"

[tasks."check:goreleaser"]
description = "Validate the goreleaser config"
run = "goreleaser check --config cmd/hive/.goreleaser.yml"

# A report, not a gate: Hive Desktop calls into the shared internal/ packages
# from its own module, so a finding here is not proof that the function is
# dead. It becomes a failing gate once the desktop code is in this repository.
[tasks."check:deadcode"]
description = "Report functions unreachable from any main or test in this module; ci only, not check"
run = "deadcode -test ./..."

[tasks.check]
description = "The fast gate: tidy check, lint, tests, and the goreleaser config check. Read-only; needs no Python or Docker"
run = [{ tasks = ["check:tidy", "lint", "test", "check:goreleaser"] }]

[tasks.ci]
description = "Everything CI runs: check, the site build, the deadcode report, and the Docker integration tests"
depends = ["check", "docs:build"]
run = [{ tasks = ["check:deadcode", "integration"] }]

[tasks.validate]
description = "Run doctor with dev config"
env = { HIVE_CONFIG = "./cmd/hive/dev/config.dev.yaml" }
run = "go run ./cmd/hive doctor"

[tasks."validate:invalid"]
description = "Run doctor with intentionally invalid config"
env = { HIVE_CONFIG = "./cmd/hive/dev/config.invalid.yaml" }
run = "go run ./cmd/hive doctor || true"

[tasks."lint:workflows"]
description = "Lint GitHub workflows and local actions"
run = "actionlint"

[tasks.integration]
description = "Run Docker-based integration tests"
depends = ["build"]
run = "docker build -f cmd/hive/Dockerfile.test -t hive-integration-test . && docker run --rm hive-integration-test"

[tasks."build:container"]
description = "Build only the linux binary for the host arch (used by container images)"
depends = ["generate"]
run = "GOOS=linux goreleaser build --snapshot --clean --single-target --config cmd/hive/.goreleaser.yml"

[tasks."container"]
description = "Build Docker image and run ephemeral container"
depends = ["build:container"]
run = "docker run --rm -it -e HIVE_ASSESS_ISOLATED=1 -e CLAUDE_CREDENTIALS=\"$CLAUDE_CREDENTIALS\" $(docker build -q -f cmd/hive/Dockerfile .)"

[tasks."container:rootless"]
description = "Build image and run ephemeral container with rootless podman"
depends = ["build:container"]
run = "podman run --rm -it -e HIVE_ASSESS_ISOLATED=1 -e CLAUDE_CREDENTIALS=\"$CLAUDE_CREDENTIALS\" $(podman build -q -f cmd/hive/Dockerfile .)"

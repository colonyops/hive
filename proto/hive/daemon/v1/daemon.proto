syntax = "proto3";

package hive.daemon.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// DaemonService describes and controls the daemon process itself.
service DaemonService {
  rpc Hello(HelloRequest) returns (HelloResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  // Reload re-reads config.yaml and rebuilds the engine's services.
  rpc Reload(ReloadRequest) returns (ReloadResponse);
}

// SessionService is sessionapi.API over the wire. A create failure carries a
// LaunchErrorDetail or a CreateSessionErrorDetail as a Connect error detail.
service SessionService {
  rpc List(ListRequest) returns (ListResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Create(CreateRequest) returns (stream CreateResponse);
  rpc CreateFromRequest(CreateFromRequestRequest) returns (CreateFromRequestResponse);
  rpc CreateWithWindows(CreateWithWindowsRequest) returns (CreateWithWindowsResponse);
  rpc Rename(RenameRequest) returns (RenameResponse);
  rpc SetGroup(SetGroupRequest) returns (SetGroupResponse);
  rpc SetTags(SetTagsRequest) returns (SetTagsResponse);
  // EditTags adds and then removes tags in one store transaction, so two
  // clients that each add a tag both keep theirs.
  rpc EditTags(EditTagsRequest) returns (EditTagsResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Recycle(RecycleRequest) returns (stream RecycleResponse);
  rpc Prune(PruneRequest) returns (PruneResponse);
  rpc Risk(RiskRequest) returns (RiskResponse);
  rpc LaunchOptions(LaunchOptionsRequest) returns (LaunchOptionsResponse);
  // Statuses answers from the daemon's status loop, never from a fetch of
  // its own, so every client shares one tracker.
  rpc Statuses(StatusesRequest) returns (StatusesResponse);
  // GitStatuses reads the checkouts of sessions on the daemon's machine. A
  // read is shared by every client that asks within a few seconds.
  rpc GitStatuses(GitStatusesRequest) returns (GitStatusesResponse);
  // StartTmux opens the tmux session of a session on the daemon's machine
  // in the background, by that machine's rules. It creates the session
  // and starts the agent when no tmux session runs.
  rpc StartTmux(StartTmuxRequest) returns (StartTmuxResponse);
}

message HelloRequest {}

message HelloResponse {
  string version = 1;
  int32 pid = 2;
  string data_dir = 3;
  google.protobuf.Timestamp started_at = 4;
  bool status_available = 5;
  // protocol_version is the daemon's wire protocol. A client refuses a daemon
  // outside the range it supports. Daemons before the field send 0.
  int32 protocol_version = 6;
}

message HealthRequest {}

message HealthResponse {
  bool db_ok = 1;
  string db_error = 2;
  bool tmux_ok = 3;
  StatusLoopHealth status_loop = 4;
  map<string, int32> sessions_by_state = 5;
  google.protobuf.Duration uptime = 6;
  // supervised is true for a daemon that `hive daemon install` started.
  bool supervised = 7;
  // agents are the configured agent profiles and where the daemon finds
  // each command on its PATH.
  repeated AgentCheck agents = 8;
}

message AgentCheck {
  string profile = 1;
  string command = 2;
  // path is empty when the command is not on the daemon's PATH.
  string path = 3;
}

message StatusLoopHealth {
  google.protobuf.Timestamp last_tick = 1;
  int64 last_duration_ms = 2;
  int64 errors = 3;
  bool paused = 4;
}

message StopRequest {}

message StopResponse {}

message ReloadRequest {}

message ReloadResponse {}

message Session {
  string id = 1;
  string name = 2;
  string slug = 3;
  string path = 4;
  string remote = 5;
  string state = 6;
  string clone_strategy = 7;
  repeated string tags = 8;
  map<string, string> metadata = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ListRequest {}

message ListResponse {
  repeated Session sessions = 1;
}

message GetRequest {
  string id = 1;
}

message GetResponse {
  Session session = 1;
}

// CreateRequest mirrors sessionsvc.CreateOptions. The daemon always creates
// in the background, so the caller attaches itself. remote must be set and
// source must be absolute: the daemon has its own working directory.
message CreateRequest {
  reserved 6;
  reserved "use_batch_spawn";

  string name = 1;
  string session_id = 2;
  string prompt = 3;
  string remote = 4;
  string source = 5;
  string clone_strategy = 7;
  bool skip_spawn = 8;
  string agent_key = 9;
  repeated string tags = 10;
  repeated string env = 11;
  string collision_suffix = 12;
}

message CreateResponse {
  oneof event {
    // progress_line is one line the create wrote to its progress writer.
    string progress_line = 1;
    // session arrives last, once the create succeeded.
    Session session = 2;
  }
}

message CreateFromRequestRequest {
  string name = 1;
  string prompt = 2;
  string agent = 3;
  string repo = 4;
  string collision_suffix = 5;
  repeated string tags = 6;
  repeated string env = 7;
}

message CreateFromRequestResponse {
  Session session = 1;
}

message PaneSpec {
  string command = 1;
  string working_directory = 2;
  string size = 3;
  string split = 4;
}

message WindowSpec {
  string name = 1;
  string command = 2;
  string working_directory = 3;
  bool focus = 4;
  repeated PaneSpec panes = 5;
}

message CreateWithWindowsRequest {
  string name = 1;
  string remote = 2;
  string sh_cmd = 3;
  repeated WindowSpec windows = 4;
}

message CreateWithWindowsResponse {
  Session session = 1;
}

message RenameRequest {
  string id = 1;
  string name = 2;
}

message RenameResponse {}

message SetGroupRequest {
  string id = 1;
  string group = 2;
}

message SetGroupResponse {}

message SetTagsRequest {
  string id = 1;
  repeated string tags = 2;
}

message SetTagsResponse {
  Session session = 1;
}

message EditTagsRequest {
  string id = 1;
  repeated string add = 2;
  repeated string remove = 3;
}

message EditTagsResponse {
  Session session = 1;
}

message DeleteRequest {
  string id = 1;
}

message DeleteResponse {}

message RecycleRequest {
  string id = 1;
}

message RecycleResponse {
  string progress_line = 1;
}

message PruneRequest {
  bool all = 1;
}

message PruneResponse {
  int32 count = 1;
}

message RiskRequest {
  string id = 1;
}

message RiskResponse {
  bool uncommitted_changes = 1;
  bool unpushed_commits = 2;
}

message LaunchOptionsRequest {}

message LaunchRepository {
  string name = 1;
  string remote = 2;
  string source = 3;
}

message LaunchOptionsResponse {
  repeated LaunchRepository repositories = 1;
  string default_repository = 2;
  repeated string agents = 3;
  string default_agent = 4;
}

message RootRepoTarget {
  string name = 1;
  string path = 2;
}

message StatusesRequest {
  repeated string session_ids = 1;
  repeated RootRepoTarget roots = 2;
}

message StatusesResponse {
  // statuses is keyed like status.Service.FetchBatch: session id, or
  // status.RootStatusKey for a root.
  map<string, TerminalStatus> statuses = 1;
}

message StartTmuxRequest {
  string id = 1;
}

message StartTmuxResponse {
  bool created = 1;
  bool completed = 2;
}

message GitStatusesRequest {
  repeated string session_ids = 1;
}

message GitStatusesResponse {
  // statuses is keyed by session id. A session that does not exist is absent.
  map<string, GitStatus> statuses = 1;
}

// GitStatus carries every gitstatus.Status field. error and unpushed_error
// are the failed reads' text.
message GitStatus {
  string path = 1;
  string branch = 2;
  bool dirty = 3;
  bool unpushed = 4;
  int32 additions = 5;
  int32 deletions = 6;
  string host = 7;
  string owner = 8;
  string repo = 9;
  bool resolved = 10;
  string error = 11;
  string unpushed_error = 12;
}

message PaneStatus {
  string pane_id = 1;
  string status = 2;
  string tool = 3;
  string pane_content = 4;
  bool is_agent = 5;
}

message WindowStatus {
  string window_index = 1;
  string window_name = 2;
  string status = 3;
  string tool = 4;
  string pane_content = 5;
  repeated PaneStatus panes = 6;
}

message TerminalStatus {
  bool session_present = 1;
  bool presence_known = 2;
  string status = 3;
  string tool = 4;
  string window_name = 5;
  string pane_content = 6;
  bool is_loading = 7;
  string error = 8;
  repeated WindowStatus windows = 9;
}

// LaunchErrorDetail carries every sessionsvc.LaunchError field. err is the
// wrapped error's text.
message LaunchErrorDetail {
  string name = 1;
  string remote = 2;
  string destination = 3;
  string clone_strategy = 4;
  bool leftover_checkout = 5;
  string step = 6;
  string output = 7;
  string err = 8;
}

// CreateSessionErrorDetail carries every sessionsvc.CreateSessionError field.
message CreateSessionErrorDetail {
  string operation = 1;
  string destination = 2;
  string clone_strategy = 3;
  string err = 4;
}

// InvalidTagDetail marks an INVALID_ARGUMENT error as a rejected tag, so the
// client can tell it from a create with no remote.
message InvalidTagDetail {}

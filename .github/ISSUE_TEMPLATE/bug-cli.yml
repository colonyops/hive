name: Bug report (hive CLI/TUI)
description: Report something in the hive CLI or TUI that does not work as expected.
type: Bug
labels: ["area/cli"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      description: Please confirm the following before filing.
      options:
        - label: I searched the existing issues and did not find a report of this bug.
          required: true
        - label: This is not a security vulnerability. Vulnerabilities are reported through a private security advisory, not a public issue.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug. Include the exact text of any error message.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The steps needed to trigger the bug, and whether it happens every time.
      placeholder: |
        1. Run `hive new --remote <url> my-session`
        2. Open the TUI with `hive`
        3. Recycle the session
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `hive --version`.
      placeholder: hive version 0.59.0 (b05eebb) 2026-09-16T14:39:18Z
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install hive?
      options:
        - Homebrew
        - go install
        - Release binary
        - Built from source
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your operating system and version, terminal, tmux version, shell, and the coding agent you use.
      placeholder: |
        - macOS 26.0
        - Ghostty 1.2
        - tmux 3.5a (Homebrew)
        - zsh
        - Claude Code
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The part of your `config.yaml` that the bug involves. Remove anything private.
      render: yaml
    validations:
      required: false

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# event_name is in the group so that a run that publish.yml calls does not
# share a group with the push run on the same ref.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only a pull request filters by path. Every other event runs every job.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      cli-integration: ${{ steps.filter.outputs.cli-integration }}
      cli-remote: ${{ steps.filter.outputs.cli-remote }}
      site: ${{ steps.filter.outputs.site }}
      desktop-frontend: ${{ steps.filter.outputs.desktop-frontend }}
      drive-server-frontend: ${{ steps.filter.outputs.drive-server-frontend }}
      desktop-e2e: ${{ steps.filter.outputs.desktop-e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'cmd/hive/.goreleaser.yml'
              - 'sqlc.yaml'
              - 'internal/store/db/**'
              - 'cmd/desktop/internal/app/data/queries/**'
              - 'cmd/desktop/frontend/bindings/**'
              - 'cmd/desktop/scripts/**'
              - 'docs/decisions/**'
              - 'mise.toml'
              - 'mise.lock'
              - 'cmd/desktop/tasks.toml'
              - 'cmd/drive-server/**'
              - '.github/workflows/**'
              - '.github/actions/**'
            cli-integration:
              - 'main.go'
              - 'cmd/hive/**'
              - 'internal/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - '.dockerignore'
              - 'test/integration/**'
              - 'mise.toml'
              - 'mise.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            cli-remote:
              - 'main.go'
              - 'cmd/hive/**'
              - 'internal/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - '.dockerignore'
              - 'test/remote/**'
              - 'test/smoke/**'
              - 'mise.toml'
              - 'mise.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            site:
              - 'docs/**'
              - 'mise.toml'
              - 'mise.lock'
              - '.github/workflows/ci.yml'
            desktop-frontend:
              - 'cmd/desktop/frontend/**'
              - 'cmd/desktop/internal/app/flow/docs/**'
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            drive-server-frontend:
              - 'cmd/drive-server/frontend/**'
              - 'web/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            desktop-e2e:
              - 'cmd/desktop/**'
              - 'cmd/hive/**'
              - 'test/remote/**'
              - 'mise.toml'
              - 'internal/**'
              - 'pkg/**'
              - 'web/**'
              - 'go.mod'
              - 'go.sum'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  go:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-env
        with:
          cache-name: test

      - name: Check generated files are up-to-date
        run: mise run check:generate

      # Binding method IDs hash the Go package path, so a service that moved
      # without a regenerate leaves committed TypeScript that typechecks and
      # fails every RPC at runtime. Nothing else in this workflow can see it.
      - name: Check Wails bindings are up-to-date
        run: mise run desktop:check:bindings

      - name: Check ADR ids, citations, and index
        run: mise run check:adr

      - name: Check desktop migrations are ordered and released history is immutable
        run: mise run desktop:check:migrations

      - name: Check go.mod and go.sum are tidy
        run: mise run check:tidy

      - name: Build
        run: go build ./...

      # main runs the same non-race tests as a pull request so that the cache
      # it saves holds the test results a pull request can reuse.
      - name: Test
        run: mise run test

  go-race:
    needs: changes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-env
        with:
          cache-name: race

      - name: Test with the race detector
        run: mise run test:race

  go-lint:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-env
        with:
          cache-name: lint

      # setup-go-env caches ~/.cache/golangci-lint with the Go cache. The
      # action's own cache keys on the week and go.mod and never saves on a hit.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=6m
          skip-cache: true

      - name: Lint workflows
        run: mise run lint:workflows

      - name: Check goreleaser config
        run: mise run cli:check:goreleaser

      # Neither is in `mise run check`: deadcode builds the program's SSA and
      # govulncheck needs the network, so both are past what a pre-push hook
      # should cost.
      - name: Check for unreachable code
        run: mise run check:deadcode

      - name: Check dependencies for known vulnerabilities
        run: mise run check:vuln

  integration:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.cli-integration == 'true'
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The CLI and the drive server build with CGO_ENABLED=0, and tmux runs
      # inside the test container, so this job needs no Linux packages. The
      # tool list leaves out wails3, whose install links GTK.
      - uses: ./.github/actions/setup-go-env
        with:
          cache-name: integration
          desktop-deps: "false"
          mise-install-args: go goreleaser go:github.com/abice/go-enum github:sqlc-dev/sqlc github:hay-kot/gobusgen github:bufbuild/buf

      - name: Run integration tests
        run: mise run cli:integration

  # Two hive servers behind sshd in Docker, driven from the runner over ssh.
  remote:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.cli-remote == 'true'
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-env
        with:
          cache-name: remote
          desktop-deps: "false"
          mise-install-args: go goreleaser go:github.com/abice/go-enum github:sqlc-dev/sqlc github:hay-kot/gobusgen github:bufbuild/buf

      - name: Run remote server tests
        run: mise run cli:remote:test

      - name: Check the smoke stack
        run: mise run cli:smoke:test

  # The static checks (format, lint, vue-tsc, build) and the vitest suite are independent; one job made
  # the shorter wait on the longer.
  desktop-frontend-build:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop-frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting
        run: |
          npm run format:check -w frontend
          npm run ui:format:check

      - name: Lint
        run: |
          npm run lint -w frontend
          npm run ui:lint

      - name: Build frontend
        run: npm run build -w frontend

  desktop-frontend-test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop-frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: |
          npm test -w frontend
          npm run ui:test

  drive-server-frontend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.drive-server-frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check -w drive-server-frontend

      - name: Lint
        run: npm run lint -w drive-server-frontend

      - name: Build frontend
        run: npm run build -w drive-server-frontend

      - name: Test frontend
        run: npm test -w drive-server-frontend

  # The whole suite runs inside the image that run-docker.sh builds, so the
  # job needs Docker and mise, not Go or Node.
  desktop-e2e:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # run-docker.sh builds the frontend and the headless server on the
      # runner, with these caches, before the image build. The server has no
      # cgo, so the job needs no Linux packages.
      - uses: ./.github/actions/setup-go-env
        with:
          cache-name: e2e
          desktop-deps: "false"
          mise-install-args: go goreleaser go:github.com/abice/go-enum github:sqlc-dev/sqlc github:hay-kot/gobusgen github:bufbuild/buf

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run desktop e2e tests
        run: mise run desktop:e2e

      - name: Run desktop e2e tests against a server
        run: mise run desktop:e2e:remote

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-e2e-test-results
          path: cmd/desktop/e2e/test-results/
          retention-days: 7

  site:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    env:
      # Without this, mise run installs every tool in mise.toml, Go tools
      # included, before it builds the site.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_LOCK_HASH: ${{ hashFiles('mise.lock') }}
        with:
          install_args: python uv
          cache_key: "{{cache_key_prefix}}-{{platform}}-{{install_args_hash}}-{{env.MISE_LOCK_HASH}}"

      - name: Build the site
        run: mise run docs:build

  # The one required check. A job that a path filter skipped reports
  # "skipped", which passes. A failure in changes skips its dependents and
  # fails here.
  ci-ok:
    if: always()
    needs: [changes, go, go-race, go-lint, integration, remote, desktop-frontend-build, desktop-frontend-test, drive-server-frontend, desktop-e2e, site]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

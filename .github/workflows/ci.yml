name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# event_name is in the group so that a run that publish.yml calls does not
# share a group with the push run on the same ref.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Only a pull request filters by path. Every other event runs every job.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      cli-integration: ${{ steps.filter.outputs.cli-integration }}
      site: ${{ steps.filter.outputs.site }}
      desktop-frontend: ${{ steps.filter.outputs.desktop-frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'sqlc.yaml'
              - 'internal/data/db/**'
              - 'cmd/desktop/internal/app/data/queries/**'
              - 'cmd/desktop/frontend/bindings/**'
              - 'cmd/desktop/scripts/**'
              - 'docs/decisions/**'
              - 'mise.toml'
              - 'cmd/desktop/tasks.toml'
              - '.github/workflows/**'
              - '.github/actions/**'
            cli-integration:
              - 'main.go'
              - 'cmd/hive/**'
              - 'internal/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - '.dockerignore'
              - 'test/integration/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            site:
              - 'docs/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            desktop-frontend:
              - 'cmd/desktop/frontend/**'
              - 'cmd/desktop/internal/app/flow/docs/**'
              - '.github/workflows/ci.yml'

  go:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-env

      - name: Check generated files are up-to-date
        run: mise run check:generate

      # Binding method IDs hash the Go package path, so a service that moved
      # without a regenerate leaves committed TypeScript that typechecks and
      # fails every RPC at runtime. Nothing else in this workflow can see it.
      - name: Check Wails bindings are up-to-date
        run: mise run desktop:check:bindings

      - name: Check ADR ids, citations, and index
        run: mise run check:adr

      - name: Check desktop migrations are ordered and released history is immutable
        run: mise run desktop:check:migrations

      - name: Check go.mod and go.sum are tidy
        run: mise run check:tidy

      - name: Build
        run: go build ./...

      - name: Test
        if: github.event_name == 'pull_request'
        run: mise run test

      - name: Test with the race detector
        if: github.event_name != 'pull_request'
        run: mise run test:race

  go-lint:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-env

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=6m

      - name: Lint workflows
        run: mise run lint:workflows

      - name: Check goreleaser config
        run: mise run check:goreleaser

      # Neither is in `mise run check`: deadcode builds the program's SSA and
      # govulncheck needs the network, so both are past what a pre-push hook
      # should cost.
      - name: Check for unreachable code
        run: mise run check:deadcode

      - name: Check dependencies for known vulnerabilities
        run: mise run check:vuln

  integration:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.cli-integration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go-env

      - name: Run integration tests
        run: mise run integration

  # The vue-tsc typecheck and the vitest suite are independent; one job made
  # the shorter wait on the longer.
  desktop-frontend-build:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop-frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/desktop/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  desktop-frontend-test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.desktop-frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cmd/desktop/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/desktop/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm test

  site:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    env:
      # Without this, mise run installs every tool in mise.toml, Go tools
      # included, before it builds the site.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: python uv

      - name: Build the site
        run: mise run docs:build

  # The one required check. A job that a path filter skipped reports
  # "skipped", which passes. A failure in changes skips its dependents and
  # fails here.
  ci-ok:
    if: always()
    needs: [changes, go, go-lint, integration, desktop-frontend-build, desktop-frontend-test, site]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

name: Build and Publish

permissions:
  contents: write # for release
  packages: write

on:
  workflow_dispatch:
    inputs:
      semverbump:
        description: "Which version to bump by"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Build the release, but push no tag, publish nothing, and deploy nothing"
        type: boolean
        default: false

jobs:
  test:
    name: "Test"
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  release:
    name: "Release"
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 gets the full history and the tags, which the tag
      # step and the GoReleaser changelog read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Select the release tag
        id: tag
        env:
          RELEASE_BUMP: ${{ inputs.semverbump }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          go run ./cmd/tools/release cli tag
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --config cmd/hive/.goreleaser.yml ${{ inputs.dry_run && '--skip=publish,announce,validate' || '' }}
        env:
          # GoReleaser does not look for tags itself when these are set. The
          # repository holds tags of other programs, which it must not use.
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.current }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.tag.outputs.previous }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  docs:
    name: "Deploy Docs"
    if: ${{ !inputs.dry_run }}
    needs:
      - release
    # A called workflow gets at most the permissions of the job that calls it.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml

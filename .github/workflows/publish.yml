name: Build and Publish

permissions:
  contents: write # for release
  packages: write

# The maintainer's `release` run dispatches this after it has published the
# desktop and pushed the release tag. It builds the CLI from that tag, creates
# the one GitHub release for every program with the promoted release notes,
# and deploys the site (ADR every-program-ships-under-one-date-based-version).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag, such as v0.20261001.0. It must already exist on main."
        required: true
        type: string
      dry_run:
        description: "Build the release, but publish nothing and deploy nothing"
        type: boolean
        default: false

jobs:
  test:
    name: "Test"
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  release:
    name: "Release"
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - name: Check the tag and write the release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a release tag"; exit 1; }
          [[ $(git rev-parse "refs/tags/$TAG^{commit}") == $(git rev-parse HEAD) ]] || { echo "::error::checkout is not at $TAG"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          go run ./cmd/tools/release changelog notes "${TAG#v}" > "$RUNNER_TEMP/release-notes.md"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --config cmd/hive/.goreleaser.yml --release-notes ${{ runner.temp }}/release-notes.md ${{ inputs.dry_run && '--skip=publish,announce,validate' || '' }}
        env:
          # GoReleaser does not look for the tag itself when this is set. The
          # repository still holds the desktop-v* tags, which it must not use.
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  docs:
    name: "Deploy Docs"
    if: ${{ !inputs.dry_run }}
    needs:
      - release
    # A called workflow gets at most the permissions of the job that calls it.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml

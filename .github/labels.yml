# The org issue type (Bug, Feature, Task) says what kind of work an issue is.
# Labels say where the work is. `mise run github:labels` applies this file.

# Artifact
- name: area/cli
  color: "0e8a16"
  description: Command line interface
- name: area/desktop
  color: "006b75"
  description: Hive Desktop app
- name: area/relay
  color: "e99695"
  description: Relay service
- name: area/sites
  color: "bfd4f2"
  description: Documentation and marketing sites

# Subsystem
- name: area/tui
  color: "1d76db"
  description: Terminal user interface
- name: area/storage
  color: "fbca04"
  description: Data persistence and storage
- name: area/sessions
  color: "d93f0b"
  description: Session management
- name: area/integrations
  color: "5319e7"
  description: External tool integrations
- name: area/terminal
  color: "0052cc"
  description: tmux-backed terminal sessions
- name: area/observability
  color: "f9d0c4"
  description: Metrics, traces, logs, alerts, and dashboards

# Workflow
- name: good first issue
  color: "7057ff"
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed
- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation
- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists
- name: invalid
  color: "e4e669"
  description: This doesn't seem right
- name: wontfix
  color: "ffffff"
  description: This will not be worked on
- name: question
  color: "d876e3"
  description: Further information is requested
- name: epic
  color: "7057ff"
  description: Large multi-phase feature
- name: plugin
  color: "24fb81"
  description: Plugin system and bundled plugins
- name: "priority: low"
  color: "c2e0c6"
  description: Nice to have; not time-sensitive
# Renovate adds this label to vulnerability fix pull requests.
- name: security
  color: "ee0701"
  description: Fixes a known vulnerability

# Kind. Issue types replace these labels. They stay declared until every issue
# has a type, because a prune deletes the label from the issues that carry it.
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: feature
  color: "ededed"
  description: New capability
- name: bugfix
  color: "ededed"
  description: Fixes a bug
- name: type/research
  color: "c5def5"
  description: Investigation or exploration
